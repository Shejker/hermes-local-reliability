model:
  provider: ollama-launch
  default: sec-27b:latest
  base_url: http://127.0.0.1:11434/v1
  api_mode: chat_completions
  context_length: 65536
  ollama_num_ctx: 65536

providers:
  ollama-launch:
    name: Ollama
    api: http://127.0.0.1:11434/v1
    default_model: sec-27b:latest
    discover_models: true
    models:
      "sec-27b:latest": {}
      "huihui_ai/Qwen3.8-abliterated:27b": {}
      "qwen3-coder-compress:64k": {}
      "qwen3-coder:30b": {}
      "qwen3-vl:8b": {}

toolsets:
  - hermes-cli
  - web

terminal:
  backend: local

compression:
  enabled: true
  threshold: 0.50
  threshold_tokens: 40960
  target_ratio: 0.20
  tail_mode: lean
  protect_first_n: 0
  protect_last_n: 4
  min_tail_user_messages: 1
  max_attempts: 6
  proactive_prune_tokens: 32768
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 2048
  abort_on_summary_failure: false
  in_place: true
  idle_compact_after_seconds: 1800
  progress_notices: true

auxiliary:
  compression:
    provider: custom
    model: qwen3-coder-compress:64k
    base_url: http://127.0.0.1:11434/v1
    api_key: ""
    timeout: 300
  vision:
    provider: custom
    model: qwen3-vl:8b
    base_url: http://127.0.0.1:11434/v1
    api_key: ""
    timeout: 120
    download_timeout: 30
    max_concurrency: 8

approvals:
  mode: "off"

command_allowlist:
  - execute_code

telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2

_config_version: 50
